name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r reference/python/requirements.txt

      - name: Run verifier tests
        working-directory: reference/python
        run: python -m unittest discover -v -p "test_*.py"

  native-vice-provider:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 provider
            os: macos-15
          - name: Windows x64 provider
            os: windows-2025

    runs-on: ${{ matrix.os }}
    env:
      DADE_FIXTURE_ROOT: ${{ github.workspace }}/native/vice-provider/fixtures

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/requirements.txt

      - name: Install Python fixture dependencies
        run: python -m pip install -r reference/python/requirements.txt

      - name: Generate Python conformance fixtures
        run: python reference/python/generate_vice_fixture.py native/vice-provider/fixtures

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test native provider
        run: cargo test --manifest-path native/vice-provider/Cargo.toml

      - name: Build native provider
        run: cargo build --release --manifest-path native/vice-provider/Cargo.toml

      - name: Package for VICE
        run: python native/vice-provider/package.py native/vice-provider/dist

      - name: Check packaged provider
        run: python -c "from pathlib import Path; files=list(Path('native/vice-provider/dist').iterdir()); assert len(files)==1 and files[0].name.startswith('dade_provider.'), files"
