name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r reference/python/requirements.txt

      - name: Run verifier tests
        working-directory: reference/python
        run: python -m unittest discover -v -p "test_*.py"
