[package]
name = "dade-vice-provider"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dade_provider"
crate-type = ["cdylib", "rlib"]

[dependencies]
ciborium = "0.2.2"
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
